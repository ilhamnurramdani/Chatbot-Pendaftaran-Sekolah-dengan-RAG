<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Edit Data Knowledge (ID: {{ document.id }})</h1>
        <form action="{{ url_for('edit_data', doc_id=document.id) }}" method="POST">
             <div class="mb-3">
                <label for="question" class="form-label">Pertanyaan</label>
                <input type="text" class="form-control" id="question" name="question" value="[Edit Pertanyaan di sini]" required>
            </div>
            <div class="mb-3">
                <label for="answer" class="form-label">Jawaban (Teks Asli: {{ document.text }})</label>
                <textarea class="form-control" id="answer" name="answer" rows="5" required>[Edit Jawaban di sini]</textarea>
            </div>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Batal</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>
</body>
</html>
