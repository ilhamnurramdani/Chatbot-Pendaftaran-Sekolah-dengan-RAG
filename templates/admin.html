<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Knowledge Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>📚 Knowledge Base</h1>
            <a href="{{ url_for('add_data') }}" class="btn btn-primary">Tambah Data Baru</a>
        </div>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Teks (Pertanyaan & Jawaban)</th>
                    <th scope="col" style="width: 15%;">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for doc in documents %}
                <tr>
                    <th scope="row">{{ doc.id }}</th>
                    <td>{{ doc.text }}</td>
                    <td>
                        <a href="{{ url_for('edit_data', doc_id=doc.id) }}" class="btn btn-warning btn-sm">Edit</a>
                        <form action="{{ url_for('delete_data', doc_id=doc.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Anda yakin ingin menghapus data ini?');">
                            <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
